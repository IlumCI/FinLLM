[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lamb"
version = "0.1.0"
description = "LAMb -- Latent Arithmetic Machine: a number-native, depth-recurrent latent-reasoning autoregressive model with test-time memory and self-play self-improvement."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "IlumCI" }]
keywords = [
    "latent-reasoning",
    "autoregressive-transformer",
    "arithmetic",
    "test-time-memory",
    "self-play",
    "self-improvement",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "maturin>=1.7"]
# The language bridge only. Kept out of the core dependencies deliberately: every
# arithmetic number in this repo was produced under the pinned environment below,
# torch moves accuracy on a model this small between minor versions, and a text
# front-end should not be able to shift the ground under a measurement it has
# nothing to do with. `uv sync --extra bridge` when you want GSM8K.
bridge = ["transformers>=4.40"]

[project.scripts]
lamb-train = "lamb.train:main"
lamb-poet = "lamb.poet:main"
lamb-poet-shared = "lamb.poet_shared:main"
lamb-memory-bench = "lamb.memory_bench:main"
lamb-ruler-bench = "lamb.ruler_bench:main"
lamb-coconut = "lamb.coconut:main"
lamb-lotus = "lamb.lotus:main"
lamb-latent-rl = "lamb.latent_rl:main"
lamb-comm = "lamb.comm:main"
lamb-comm-transfer = "lamb.comm_transfer:main"
lamb-comm-pop = "lamb.comm_pop:main"
lamb-bridge = "lamb.bridge_train:main"

[tool.hatch.build.targets.wheel]
packages = ["lamb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
